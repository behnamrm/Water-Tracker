name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: base64 of a keystore to sign the debug APK with, so new builds can be installed
      # over older ones. See README.
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install stable debug keystore
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: water-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
